name: Secret scanner miss or false positive
description: secret_scan.py flagged something harmless, or missed a kind of secret
labels: [secret-scan]
body:
  - type: markdown
    attributes:
      value: "**Never paste a real secret here.** Describe its shape instead, e.g. `xyz_` followed by 40 letters and digits."
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [False positive, Missed secret]
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: The line, with the value replaced
      description: e.g. `token = "<40 hex chars>"` in a `.yml` file
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule reported (for false positives)
      placeholder: assignment
