name: Bug
description: A skill or script did the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked Claude (or the command you ran), and what it did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Plugin version (`claude plugin list`), Claude Code version (`claude --version`), Python version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows (Git Bash), Windows (PowerShell only), Other]
    validations:
      required: true
  - type: textarea
    id: issue-file
    attributes:
      label: The issue file or backlog involved (if any)
      description: Paste it, with anything sensitive removed.
      render: markdown
