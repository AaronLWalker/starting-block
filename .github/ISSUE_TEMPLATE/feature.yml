name: Idea or improvement
description: Something the plugin should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where the plugin got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'd know it's solved.
